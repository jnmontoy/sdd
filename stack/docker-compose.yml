# Orquestación para DESARROLLO local (recarga en caliente, código montado, puertos expuestos).
# Para producción: sin --reload, sin montar ./backend, sin publicar 5432/6379, frontend con la
# etapa final de Dockerfile.frontend y secretos fuera del archivo .env versionado.
# Requiere un archivo .env junto a este archivo (lo genera init_project.py).

x-backend-env: &backend-env
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env}
  POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
  POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}

services:
  db:
    image: postgres:16-alpine
    container_name: ${APP_SLUG:-app}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # Solo accesible desde el equipo local.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-app}_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_SLUG:-app}_backend
    restart: unless-stopped
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_SLUG:-app}_celery_worker
    restart: unless-stopped
    entrypoint: []
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_SLUG:-app}_celery_beat
    restart: unless-stopped
    entrypoint: []
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ${APP_SLUG:-app}_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_SLUG: ${APP_SLUG:-app}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_volume:
