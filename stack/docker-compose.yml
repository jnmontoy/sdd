version: '3.8'

services:
  # Base de Datos Relacional PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: jolifoods_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jolifoods_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor de Memoria y Caché Redis (Rate Limiting y Sesiones)
  redis:
    image: redis:7-alpine
    container_name: jolifoods_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend Híbrido: Django ORM + FastAPI ASGI Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jolifoods_backend
    restart: always
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_2026}@db:5432/${POSTGRES_DB:-jolifoods_db}
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend: React + Vite + TypeScript + Bootstrap
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jolifoods_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
